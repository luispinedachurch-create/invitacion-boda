<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Natalia y Luis</title>

<style>
body {
    margin: 0;
    padding: 20px;
    background: #f4efe6;
    font-family: Arial, sans-serif;
}

.book {
    display: flex;
    max-width: 1600px;
    margin: auto;
    box-shadow: 0 0 30px rgba(0,0,0,.20);
}

.page {
    width: 50%;
    position: relative;
    background: white;
}

.page img {
    width: 100%;
    display: block;
}

.spine {
    width: 20px;
    background: linear-gradient(
        to right,
        #8b6b37,
        #d6b27a,
        #8b6b37
    );
}

.btn {
    position: absolute;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    background: #b58a4a;
    color: white;
    text-decoration: none;
    padding: 12px 25px;
    border-radius: 30px;
    font-weight: bold;
}

.btn:hover {
    background: #98713d;
}

@media (max-width: 900px) {

    .book {
        flex-direction: column;
    }

    .page {
        width: 100%;
    }

    .spine {
        width: 100%;
        height: 10px;
    }
}
</style>
</head>

<body>

<div class="book">

    <div class="page">
        <img src="1.png" alt="Invitación">

        <a class="btn"
           href="https://forms.gle/zHebV14ErA47GQnx8"
           target="_blank">
           Confirmar Asistencia
        </a>
    </div>

    <div class="spine"></div>

    <div class="page">
        2.pngUbicación">

        maps.app.goo.gl/oACd8njFiKR9by5h7"
           target="_blank">
           Ver Ubicación
        </a>
    </div>

</div>

</body>
</html>
